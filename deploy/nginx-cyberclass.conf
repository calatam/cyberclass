# nginx server block para cyberclass.calatam.com
# Instalar en: /etc/nginx/sites-available/cyberclass
# Activar:     sudo ln -s /etc/nginx/sites-available/cyberclass /etc/nginx/sites-enabled/
# SSL lo agrega certbot automáticamente (--nginx)
#
# NOTA (ISSUE-003): add_header dentro de un location SUPRIME los add_header
# del server block. Por eso los headers de seguridad se repiten en cada
# location que define sus propios add_header (index.html y assets) — si no,
# las rutas SPA se sirven sin ningún header de seguridad.

server {
    listen 80;
    listen [::]:80;
    server_name cyberclass.calatam.com;

    root /var/www/cyberclass;
    index index.html;

    # API backend (Fastify en localhost:3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash: cache agresivo e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html sin cache (para desplegar nuevas versiones al instante)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback: cualquier ruta desconocida sirve index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers de seguridad (aplican a locations SIN add_header propio, ej. /api/)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
