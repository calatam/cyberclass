# nginx server block para cyberclass.calatam.com
# Instalar en: /etc/nginx/sites-available/cyberclass
# Activar:     sudo ln -s /etc/nginx/sites-available/cyberclass /etc/nginx/sites-enabled/
# SSL lo agrega certbot automáticamente (--nginx)

server {
    listen 80;
    listen [::]:80;
    server_name cyberclass.calatam.com;

    root /var/www/cyberclass;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash: cache agresivo e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html sin cache (para desplegar nuevas versiones al instante)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: cualquier ruta desconocida sirve index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers de seguridad básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
